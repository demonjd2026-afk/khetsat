<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 800" width="1460" height="800" font-family="Helvetica, Arial, sans-serif" fill="#2b2622"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d554d"/></marker></defs><rect width="1460" height="800" fill="#f7f8f3"/><text x="30" y="44" font-size="26" font-weight="700">KhetSat architecture</text><text x="30" y="68" font-size="14.5" fill="#4d463f">NASA data is turned into result files by a tested Python pipeline; a static web app reads them, and can fetch NASA data live for any place in India. No server is needed.</text><text x="30" y="104" font-size="16" font-weight="700" fill="#2b2622">Data sources</text><text x="400" y="104" font-size="16" font-weight="700" fill="#2b2622">Pipeline (Python, standard library only)</text><text x="836" y="104" font-size="16" font-weight="700" fill="#2b2622">Result files (data/processed)</text><text x="1160" y="104" font-size="16" font-weight="700" fill="#2b2622">Web app (static files)</text><rect x="30" y="118" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,118 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#2f4b8f"/><rect x="30" y="124" width="280" height="2" fill="#2f4b8f"/><text x="44" y="148" font-size="16" font-weight="700">NASA POWER daily API</text><text x="44" y="168" font-size="13.5" fill="#4d463f">Rain, max and min temperature</text><rect x="30" y="200" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,200 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#2f4b8f"/><rect x="30" y="206" width="280" height="2" fill="#2f4b8f"/><text x="44" y="230" font-size="16" font-weight="700">GPM IMERG via NASA POWER</text><text x="44" y="250" font-size="13.5" fill="#4d463f">Satellite rainfall, 2001-2025</text><rect x="30" y="364" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,364 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#8a5a2b"/><rect x="30" y="370" width="280" height="2" fill="#8a5a2b"/><text x="44" y="394" font-size="16" font-weight="700">FAO-56 Tables 11 and 12</text><text x="44" y="414" font-size="13.5" fill="#4d463f">Crop coefficients and stage lengths</text><rect x="30" y="446" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,446 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#8a5a2b"/><rect x="30" y="452" width="280" height="2" fill="#8a5a2b"/><text x="44" y="476" font-size="16" font-weight="700">Published district profiles</text><text x="44" y="496" font-size="13.5" fill="#4d463f">Current rotation at each location</text><rect x="30" y="610" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,610 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#2f4b8f"/><rect x="30" y="616" width="280" height="2" fill="#2f4b8f"/><text x="44" y="640" font-size="16" font-weight="700">NASA GIBS imagery</text><text x="44" y="660" font-size="13.5" fill="#4d463f">MODIS NDVI, SMAP soil moisture, VIIRS</text><rect x="30" y="528" width="280" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M38,528 h264 a8,8 0 0 1 8,8 v0 h-280 v0 a8,8 0 0 1 8,-8 z" fill="#8a5a2b"/><rect x="30" y="534" width="280" height="2" fill="#8a5a2b"/><text x="44" y="558" font-size="16" font-weight="700">OpenStreetMap Nominatim</text><text x="44" y="578" font-size="13.5" fill="#4d463f">Place name for chosen coordinates</text><rect x="400" y="118" width="370" height="152" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M408,118 h354 a8,8 0 0 1 8,8 v0 h-370 v0 a8,8 0 0 1 8,-8 z" fill="#1f6b4a"/><rect x="400" y="124" width="370" height="2" fill="#1f6b4a"/><text x="414" y="148" font-size="16" font-weight="700">power.py</text><text x="414" y="168" font-size="13.5" fill="#4d463f">Downloads the daily series for each</text><text x="414" y="186" font-size="13.5" fill="#4d463f">location and caches them (data/raw).</text><text x="414" y="204" font-size="13.5" fill="#4d463f"></text><text x="414" y="222" font-size="13.5" fill="#4d463f">config.py holds locations, period</text><text x="414" y="240" font-size="13.5" fill="#4d463f">and every threshold.</text><rect x="400" y="282" width="370" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M408,282 h354 a8,8 0 0 1 8,8 v0 h-370 v0 a8,8 0 0 1 8,-8 z" fill="#1f6b4a"/><rect x="400" y="288" width="370" height="2" fill="#1f6b4a"/><text x="414" y="312" font-size="16" font-weight="700">indicators.py, stats.py, run.py</text><text x="414" y="332" font-size="13.5" fill="#4d463f">Evaporative demand, onset, dry spells, trends</text><rect x="400" y="364" width="370" height="152" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M408,364 h354 a8,8 0 0 1 8,8 v0 h-370 v0 a8,8 0 0 1 8,-8 z" fill="#1f6b4a"/><rect x="400" y="370" width="370" height="2" fill="#1f6b4a"/><text x="414" y="394" font-size="16" font-weight="700">rotation.py, run_rotations.py</text><text x="414" y="414" font-size="13.5" fill="#4d463f">FAO-56 crop water need, day by day.</text><text x="414" y="432" font-size="13.5" fill="#4d463f">Daily soil-water balance for each rotation,</text><text x="414" y="450" font-size="13.5" fill="#4d463f">all 45 years. Share of water need met.</text><text x="414" y="468" font-size="13.5" fill="#4d463f">Five scores, soil sensitivity, explanations.</text><rect x="400" y="528" width="179" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M408,528 h163 a8,8 0 0 1 8,8 v0 h-179 v0 a8,8 0 0 1 8,-8 z" fill="#1f6b4a"/><rect x="400" y="534" width="179" height="2" fill="#1f6b4a"/><text x="414" y="558" font-size="16" font-weight="700">yeartypes.py</text><text x="414" y="578" font-size="13.5" fill="#4d463f">k-means vs rain terciles</text><rect x="591" y="528" width="179" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M599,528 h163 a8,8 0 0 1 8,8 v0 h-179 v0 a8,8 0 0 1 8,-8 z" fill="#1f6b4a"/><rect x="591" y="534" width="179" height="2" fill="#1f6b4a"/><text x="605" y="558" font-size="16" font-weight="700">crosscheck.py</text><text x="605" y="578" font-size="13.5" fill="#4d463f">Repeat on IMERG rain</text><rect x="400" y="624" width="370" height="42" rx="21" fill="#e3efe6" stroke="#1f6b4a"/><text x="585.0" y="651" font-size="14.5" text-anchor="middle" fill="#1f6b4a" font-weight="700">tests/: 37 unit tests cover the calculations</text><rect x="836" y="282" width="250" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M844,282 h234 a8,8 0 0 1 8,8 v0 h-250 v0 a8,8 0 0 1 8,-8 z" fill="#e0a106"/><rect x="836" y="288" width="250" height="2" fill="#e0a106"/><text x="850" y="312" font-size="16" font-weight="700">&lt;location&gt;.json</text><text x="850" y="332" font-size="13.5" fill="#4d463f">Climate indicators, 1981-2025</text><rect x="836" y="364" width="250" height="152" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M844,364 h234 a8,8 0 0 1 8,8 v0 h-250 v0 a8,8 0 0 1 8,-8 z" fill="#e0a106"/><rect x="836" y="370" width="250" height="2" fill="#e0a106"/><text x="850" y="394" font-size="16" font-weight="700">&lt;location&gt;_rotations.json</text><text x="850" y="414" font-size="13.5" fill="#4d463f">Three rotations with scores,</text><text x="850" y="432" font-size="13.5" fill="#4d463f">evidence, gaps and risks.</text><text x="850" y="450" font-size="13.5" fill="#4d463f">Soil scenarios and year types.</text><rect x="836" y="528" width="250" height="70" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M844,528 h234 a8,8 0 0 1 8,8 v0 h-250 v0 a8,8 0 0 1 8,-8 z" fill="#e0a106"/><rect x="836" y="534" width="250" height="2" fill="#e0a106"/><text x="850" y="558" font-size="16" font-weight="700">&lt;location&gt;_crosscheck.json</text><text x="850" y="578" font-size="13.5" fill="#4d463f">Reanalysis vs satellite rainfall</text><rect x="1160" y="118" width="270" height="562" rx="8" fill="#fff" stroke="#cfd5c6"/><path d="M1168,118 h254 a8,8 0 0 1 8,8 v0 h-270 v0 a8,8 0 0 1 8,-8 z" fill="#0f8b8d"/><rect x="1160" y="124" width="270" height="2" fill="#0f8b8d"/><text x="1174" y="148" font-size="16" font-weight="700">index.html, app.js, i18n files</text><text x="1174" y="168" font-size="13.5" fill="#4d463f">Suggestion box and year strip: rain,</text><text x="1174" y="186" font-size="13.5" fill="#4d463f">evaporative demand, crops by month.</text><text x="1174" y="222" font-size="13.5" fill="#4d463f">Satellite map: pick a year and</text><text x="1174" y="240" font-size="13.5" fill="#4d463f">step through the months.</text><text x="1174" y="276" font-size="13.5" fill="#4d463f">Priority sliders re-rank the three</text><text x="1174" y="294" font-size="13.5" fill="#4d463f">rotations. Cards give why, evidence,</text><text x="1174" y="312" font-size="13.5" fill="#4d463f">unknowns and local checks.</text><text x="1174" y="348" font-size="13.5" fill="#4d463f">engine.js: any place in India.</text><text x="1174" y="366" font-size="13.5" fill="#4d463f">Fetches NASA POWER live and runs the</text><text x="1174" y="384" font-size="13.5" fill="#4d463f">same calculation as the pipeline</text><text x="1174" y="402" font-size="13.5" fill="#4d463f">(546 parity checks).</text><text x="1174" y="438" font-size="13.5" fill="#4d463f">assistant.js: voice guide. Eight</text><text x="1174" y="456" font-size="13.5" fill="#4d463f">questions by tap or speech; answers</text><text x="1174" y="474" font-size="13.5" fill="#4d463f">built from the result figures.</text><text x="1174" y="492" font-size="13.5" fill="#4d463f">Answers never written by a model.</text><text x="1174" y="528" font-size="13.5" fill="#4d463f">Seven languages. Hosted as plain</text><text x="1174" y="546" font-size="13.5" fill="#4d463f">files; charts are drawn as SVG.</text><line x1="310" y1="153" x2="397" y2="153" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="353.5" y="146.0" font-size="12" text-anchor="middle" fill="#5d554d">HTTPS, JSON</text><line x1="310" y1="235" x2="397" y2="235" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="310" y1="399" x2="397" y2="399" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="353.5" y="392.0" font-size="12" text-anchor="middle" fill="#5d554d">crops.json</text><line x1="310" y1="481" x2="397" y2="481" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="353.5" y="474.0" font-size="12" text-anchor="middle" fill="#5d554d">rotations.json</text><line x1="585.0" y1="270" x2="585.0" y2="279" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="585.0" y1="352" x2="585.0" y2="361" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="489.5" y1="516" x2="489.5" y2="525" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="680.5" y1="516" x2="680.5" y2="525" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="770" y1="317" x2="833" y2="317" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="770" y1="440" x2="833" y2="440" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="770" y1="563" x2="833" y2="563" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><line x1="1086" y1="317" x2="1157" y2="317" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="1121.5" y="310.0" font-size="12" text-anchor="middle" fill="#5d554d">fetch</text><line x1="1086" y1="440" x2="1157" y2="440" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="1121.5" y="433.0" font-size="12" text-anchor="middle" fill="#5d554d">fetch</text><line x1="1086" y1="563" x2="1157" y2="563" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="1121.5" y="556.0" font-size="12" text-anchor="middle" fill="#5d554d">fetch</text><path d="M310,645 H355 V694 H1123 V645 H1157" fill="none" stroke="#5d554d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M310,563 H355 V645" fill="none" stroke="#5d554d" stroke-width="2" stroke-dasharray="7 5"/><path d="M30,153 H14 V708 H1137 V610 H1157" fill="none" stroke="#5d554d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="780.0" y="726" font-size="12" text-anchor="middle" fill="#5d554d">map tiles, place names and live NASA POWER data for any place, fetched by the viewer's browser</text><text x="30" y="765" font-size="13.5" font-weight="700">Legend</text><rect x="100" y="752" width="26" height="14" rx="3" fill="#fff" stroke="#cfd5c6"/><rect x="100" y="752" width="26" height="5" rx="2" fill="#2f4b8f"/><text x="134" y="765" font-size="13.5">NASA data</text><rect x="232" y="752" width="26" height="14" rx="3" fill="#fff" stroke="#cfd5c6"/><rect x="232" y="752" width="26" height="5" rx="2" fill="#8a5a2b"/><text x="266" y="765" font-size="13.5">Reference data</text><rect x="404" y="752" width="26" height="14" rx="3" fill="#fff" stroke="#cfd5c6"/><rect x="404" y="752" width="26" height="5" rx="2" fill="#1f6b4a"/><text x="438" y="765" font-size="13.5">Pipeline code</text><rect x="568" y="752" width="26" height="14" rx="3" fill="#fff" stroke="#cfd5c6"/><rect x="568" y="752" width="26" height="5" rx="2" fill="#e0a106"/><text x="602" y="765" font-size="13.5">Result files</text><rect x="724" y="752" width="26" height="14" rx="3" fill="#fff" stroke="#cfd5c6"/><rect x="724" y="752" width="26" height="5" rx="2" fill="#0f8b8d"/><text x="758" y="765" font-size="13.5">Web app</text><line x1="840" y1="760" x2="884" y2="760" stroke="#5d554d" stroke-width="2" marker-end="url(#a)"/><text x="896" y="765" font-size="13.5">Built ahead of time</text><line x1="1055" y1="760" x2="1099" y2="760" stroke="#5d554d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="1111" y="765" font-size="13.5">Fetched live in the browser</text></svg>