<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhetSat: crop rotations for uncertain rains, from NASA data</title>
<meta name="description" content="KhetSat compares crop rotations for Andhra Pradesh using 45 years of NASA weather data. NASA Space Apps Challenge 2026, Field Shift.">
<link rel="icon" type="image/svg+xml" href="app/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Anek+Kannada:wght@400;500;600;700&family=Anek+Latin:wght@400;500;600;700&family=Anek+Odia:wght@400;500;600;700&family=Anek+Tamil:wght@400;500;600;700&family=Anek+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="brand-mark" href="./" aria-label="KhetSat">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true" focusable="false">
        <rect width="48" height="48" rx="11" fill="#ffffff"/>
        <path d="M12.5 17.5A15 15 0 0 1 33 10.6" fill="none" stroke="#1f6b4a" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="35.6" cy="11.8" r="3.4" fill="#e0a106"/>
        <path d="M8 28Q24 16.5 40 28" fill="none" stroke="#1f6b4a" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M8 34.5Q24 23 40 34.5" fill="none" stroke="#1f6b4a" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M8 41Q24 29.5 40 41" fill="none" stroke="#1f6b4a" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">KhetSat</span>
        <span class="brand-line" id="tagline"></span>
      </span>
    </a>
  </div>
  <div class="lang"><label for="lang" id="lang-label"></label><select id="lang"></select></div>
</header>

<main>
  <nav class="places" id="places" aria-label="Location"></nav>

  <section class="place-form" id="place-form" aria-labelledby="form-title" hidden>
    <h2 id="form-title"></h2>
    <p class="lede" id="form-intro"></p>
    <form id="form" novalidate></form>
    <p class="note" id="form-status" role="status"></p>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>

  <section class="advice" id="advice" data-view="advice" aria-labelledby="advice-title" hidden>
    <h2 id="advice-title"></h2>
    <div id="advice-points"></div>
  </section>

  <section class="strip" id="strip" data-view="rain" aria-labelledby="strip-title">
    <h1 id="strip-title"></h1>
    <p class="lede" id="strip-intro"></p>
    <div class="scroll"><div id="strip-chart"></div></div>
    <ul class="legend" id="strip-legend"></ul>
    <p class="note" id="grid-note"></p>
  </section>

  <details class="trust fold" id="trust" data-view="proof" hidden>
    <summary><h2 id="trust-title"></h2></summary>
    <ul id="trust-points"></ul>
  </details>

  <details class="change fold" id="change" data-view="rain" hidden>
    <summary><h2 id="change-title"></h2></summary>
    <ul id="change-points"></ul>
  </details>

  <section class="map" id="map-section" data-view="map" aria-labelledby="map-title" hidden>
    <h2 id="map-title"></h2>
    <p class="lede" id="map-intro"></p>
    <div class="map-controls">
      <div class="segments" id="map-layers" role="group"></div>
      <div class="segments" id="map-moments" role="group"></div>
    </div>
    <div id="map"></div>
    <p class="note" id="map-key"></p>
  </section>

  <div class="work" id="work" data-view="rotations">
    <aside class="priorities" aria-labelledby="priorities-title">
      <h2 id="priorities-title"></h2>
      <p id="priorities-intro"></p>
      <div id="sliders"></div>
      <div class="soil-pick" id="soil-pick"></div>
    </aside>
    <section class="rotations" aria-labelledby="rotations-title">
      <h2 id="rotations-title"></h2>
      <ol id="rotation-list"></ol>
    </section>
  </div>

  <details class="soil fold" id="soil" data-view="rotations">
    <summary><h2 id="soil-title"></h2></summary>
    <p class="lede" id="soil-intro"></p>
    <div class="segments" id="soil-choices" role="group"></div>
    <div class="scroll"><table id="soil-table"></table></div>
  </details>

  <details class="climate fold" id="climate" data-view="rain">
    <summary><h2 id="climate-title"></h2></summary>
    <dl class="stats" id="stats"></dl>
    <h3 id="years-title"></h3>
    <div class="scroll"><div id="years-chart"></div></div>
    <p class="note" id="years-note"></p>
    <p id="trend"></p>
  </details>

  <details class="check fold" id="check" data-view="proof" hidden>
    <summary><h2 id="check-title"></h2></summary>
    <p class="lede" id="check-intro"></p>
    <ul id="check-points"></ul>
    <div class="scroll"><table id="check-table"></table></div>
  </details>

  <details class="glossary fold" data-view="proof">
    <summary><h2 id="glossary-title"></h2></summary>
    <dl id="glossary"></dl>
  </details>
</main>

<footer>
  <p class="disclaimer" id="disclaimer"></p>
  <p id="review-note"></p>
  <p id="sources"></p>
  <p><a href="https://github.com/demonjd2026-afk/khetsat/blob/main/docs/METHODS.md" id="methods-link"></a></p>
  <p>NASA Space Apps Challenge 2026, Field Shift: Adapting Farms with NASA Data</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app/engine.js"></script>
<script src="app/i18n.js"></script>
<script src="app/i18n-ta.js"></script>
<script src="app/i18n-kn.js"></script>
<script src="app/i18n-mr.js"></script>
<script src="app/i18n-or.js"></script>
<script src="app/i18n-voice.js"></script>
<script src="app/i18n-soil.js"></script>
<script src="app/app.js"></script>
<script src="app/config.js"></script>
<script src="app/assistant.js"></script>
</body>
</html>
